<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VoiceGuide AI - Akıllı Rehber</title>
    <!-- Modern tipografi için Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        /* Tasarım Sistemimiz (Premium Dark Mode) */
        :root {
            --bg-color: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.6);
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #8b5cf6;
        }
        
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2rem;
            /* Arka plan için dinamik degradeler */
            background-image: radial-gradient(circle at top right, rgba(59, 130, 246, 0.15), transparent 40%),
                              radial-gradient(circle at bottom left, rgba(139, 92, 246, 0.15), transparent 40%);
        }

        .container {
            width: 100%;
            max-width: 700px;
            margin-top: 2rem;
        }

        header {
            text-align: center;
            margin-bottom: 3rem;
            animation: fadeInDown 0.8s ease-out;
        }

        h1 {
            font-size: 3.5rem;
            font-weight: 800;
            background: linear-gradient(to right, #60a5fa, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.5rem;
            letter-spacing: -1px;
        }

        p.subtitle {
            color: var(--text-muted);
            font-size: 1.2rem;
            font-weight: 400;
        }

        /* Glassmorphism Efektli Kart */
        .card {
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 2.5rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        .upload-area {
            border: 2px dashed rgba(255, 255, 255, 0.2);
            border-radius: 16px;
            padding: 4rem 2rem;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            background: rgba(0, 0, 0, 0.2);
        }

        .upload-area:hover, .upload-area.dragover {
            border-color: var(--primary);
            background: rgba(59, 130, 246, 0.1);
            transform: scale(1.02);
        }

        .upload-icon {
            font-size: 3.5rem;
            margin-bottom: 1rem;
            color: var(--primary);
        }

        .upload-text {
            font-size: 1.3rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
        }

        .upload-subtext {
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        input[type="file"] {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            cursor: pointer;
        }

        #preview-container {
            display: none;
            text-align: center;
            animation: fadeIn 0.5s ease-out;
        }

        #image-preview {
            max-width: 100%;
            max-height: 350px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.4);
            border: 1px solid rgba(255,255,255,0.1);
            object-fit: contain;
        }

        button {
            background: linear-gradient(135deg, var(--primary), var(--accent));
            color: white;
            border: none;
            border-radius: 999px;
            padding: 1rem 3rem;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            margin-top: 2rem;
            box-shadow: 0 4px 15px rgba(59, 130, 246, 0.4);
            transition: all 0.3s ease;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(59, 130, 246, 0.6);
        }

        button:disabled {
            background: #475569;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        /* Sonuç Alanı */
        #result-container {
            display: none;
            margin-top: 2rem;
            animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .result-section {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 16px;
            padding: 1.5rem;
            border: 1px solid rgba(255,255,255,0.05);
            margin-bottom: 1rem;
        }

        .result-title {
            color: var(--accent);
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            font-weight: 700;
            margin-bottom: 0.8rem;
        }

        .result-text {
            font-size: 1.05rem;
            line-height: 1.6;
            color: #e2e8f0;
        }

        .audio-player-wrapper {
            margin-top: 1.5rem;
            width: 100%;
        }

        audio {
            width: 100%;
            height: 45px;
            border-radius: 999px;
            outline: none;
        }

        /* Yükleniyor Animasyonu */
        .loader-container {
            display: none;
            flex-direction: column;
            align-items: center;
            margin-top: 3rem;
        }

        .spinner {
            width: 60px;
            height: 60px;
            border: 4px solid rgba(255,255,255,0.1);
            border-radius: 50%;
            border-top-color: var(--accent);
            animation: spin 1s cubic-bezier(0.55, 0.15, 0.45, 0.85) infinite;
            margin-bottom: 1.5rem;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(40px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
    </style>
</head>
<body>

    <header>
        <h1>VoiceGuide AI</h1>
        <p class="subtitle">Çevrenizi Yapay Zeka ile Dinleyin</p>
    </header>

    <div class="container">
        <div class="card">
            
            <!-- Resim Yükleme Alanı -->
            <div class="upload-area" id="drop-zone">
                <input type="file" id="file-input" accept="image/*">
                <div class="upload-icon">📸</div>
                <div class="upload-text">Görüntü Seçin veya Çekin</div>
                <div class="upload-subtext">JPEG, PNG formatları desteklenir</div>
            </div>

            <!-- Resim Önizleme ve Buton -->
            <div id="preview-container">
                <img id="image-preview" src="" alt="Preview">
                <br>
                <button id="analyze-btn">Yapay Zeka ile Analiz Et</button>
            </div>

            <!-- Yükleniyor Göstergesi -->
            <div class="loader-container" id="loader">
                <div class="spinner"></div>
                <p style="color: var(--text-muted); font-size: 1.1rem;">Yapay zeka analiz ediyor, ses sentezleniyor...</p>
            </div>

            <!-- Sonuç Alanı -->
            <div id="result-container">
                
                <div class="result-section">
                    <div class="result-title">Fiziksel Betimleme</div>
                    <div class="result-text" id="desc-text"></div>
                </div>
                
                <div class="result-section">
                    <div class="result-title">Tarihi & Kültürel Detaylar</div>
                    <div class="result-text" id="details-text"></div>
                </div>
                
                <div class="audio-player-wrapper">
                    <audio id="audio-player" controls autoplay>
                        Tarayıcınız ses oynatmayı desteklemiyor.
                    </audio>
                </div>
                
                <div style="text-align: center; margin-top: 1rem;">
                    <a href="#" onclick="location.reload();" style="color: var(--text-muted); text-decoration: none; font-size: 0.9rem;">← Yeni Bir Fotoğraf Analiz Et</a>
                </div>

            </div>
        </div>
    </div>

    <script>
        const fileInput = document.getElementById('file-input');
        const previewContainer = document.getElementById('preview-container');
        const imagePreview = document.getElementById('image-preview');
        const analyzeBtn = document.getElementById('analyze-btn');
        const loader = document.getElementById('loader');
        const resultContainer = document.getElementById('result-container');
        const descText = document.getElementById('desc-text');
        const detailsText = document.getElementById('details-text');
        const audioPlayer = document.getElementById('audio-player');
        const dropZone = document.getElementById('drop-zone');

        let selectedFile = null;

        // Backend API Adresi (FastAPI varsayılan olarak 8000 portunda çalışır)
        const API_URL = 'http://127.0.0.1:8000/api/v1/analyze';

        // Sürükle Bırak (Drag & Drop) Efektleri
        ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
            dropZone.addEventListener(eventName, preventDefaults, false);
        });

        function preventDefaults(e) {
            e.preventDefault();
            e.stopPropagation();
        }

        ['dragenter', 'dragover'].forEach(eventName => {
            dropZone.addEventListener(eventName, () => dropZone.classList.add('dragover'), false);
        });

        ['dragleave', 'drop'].forEach(eventName => {
            dropZone.addEventListener(eventName, () => dropZone.classList.remove('dragover'), false);
        });

        dropZone.addEventListener('drop', (e) => {
            let dt = e.dataTransfer;
            let files = dt.files;
            handleFiles(files);
        });

        fileInput.addEventListener('change', function() {
            handleFiles(this.files);
        });

        // Dosya Seçimi ve Önizleme
        function handleFiles(files) {
            if (files.length > 0) {
                selectedFile = files[0];
                const reader = new FileReader();
                reader.onload = function(e) {
                    imagePreview.src = e.target.result;
                    dropZone.style.display = 'none';
                    previewContainer.style.display = 'block';
                    resultContainer.style.display = 'none';
                }
                reader.readAsDataURL(selectedFile);
            }
        }

        // API İstediği Atma
        analyzeBtn.addEventListener('click', async () => {
            if (!selectedFile) return;

            // UI'ı Yükleniyor durumuna al
            analyzeBtn.disabled = true;
            loader.style.display = 'flex';
            previewContainer.style.display = 'none';

            // Veriyi Hazırla
            const formData = new FormData();
            formData.append('image', selectedFile);
            formData.append('lang', 'tr');

            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    body: formData
                });

                if (!response.ok) throw new Error(`API Hatası: ${response.status}`);

                const result = await response.json();
                
                if (result.status === 'success') {
                    // Verileri ekrana yaz
                    descText.textContent = result.data.description;
                    detailsText.textContent = result.data.details || '';
                    
                    // Sesi Player'a ekle
                    if (result.data.audio_url) {
                        audioPlayer.src = result.data.audio_url;
                        // Chrome vs. otomatik oynatmayı engelleyebilir, try-catch içine alıyoruz
                        audioPlayer.play().catch(e => console.log("Otomatik ses çalma engellendi:", e));
                    }
                    
                    // Sonucu göster
                    loader.style.display = 'none';
                    resultContainer.style.display = 'block';
                } else {
                    throw new Error(result.message || 'Bilinmeyen bir hata oluştu');
                }
            } catch (error) {
                alert('Analiz sırasında bir ağ hatası oluştu. Backend sunucusunun çalıştığından emin olun.\n' + error.message);
                loader.style.display = 'none';
                previewContainer.style.display = 'block';
                analyzeBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
