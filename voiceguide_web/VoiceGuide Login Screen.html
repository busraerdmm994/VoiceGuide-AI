*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; background: #080f09; font-family: 'DM Sans', sans-serif; }
:root {
  --forest:  #2d5a27; --meadow: #4a7c42; --sage: #7aad70;
  --mist:    #e8f4e6; --canvas: #f4faf2;
  --rose:    #c9747a; --blush:  #e8b4b7;
  --gold:    #c9a84c; --cream:  #f5edd8;
  --slate:   #1e2d3d; --dusk:   #3a4f63; --fog:   #7a8fa0;
  /* dark surfaces */
  --dark-bg:      #080f09;
  --dark-surface: #111a12;
  --dark-card:    #172018;
  --dark-border:  rgba(255,255,255,0.09);
  --dark-border-focus: rgba(122,173,112,0.7);
  --dark-text:    rgba(255,255,255,0.92);
  --dark-sub:     rgba(255,255,255,0.45);
  --dark-muted:   rgba(255,255,255,0.22);
}
@keyframes fadeUp   { from { opacity:0; transform:translateY(16px); } to { opacity:1; transform:translateY(0); } }
@keyframes pulseRing { 0%,100%{transform:scale(1);opacity:0.6} 50%{transform:scale(1.12);opacity:0} }
@keyframes waveBar  { 0%,100%{transform:scaleY(0.4)} 50%{transform:scaleY(1)} }
@keyframes shimmer  { 0%{background-position:-200% 0} 100%{background-position:200% 0} }
</style>

<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useRef, useEffect } = React;

/* ─── ICONS ─── */

  apple:  "M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.8-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M13 3.5c.73-.83 1.94-1.46 2.94-1.5.13 1.17-.34 2.35-1.04 3.19-.69.85-1.83 1.51-2.95 1.42-.15-1.15.41-2.35 1.05-3.11z",
  google: "M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z",

/* ─── PHONE FRAME ─── */
function PhoneFrame({ children, width=390, height=844, label, variant, active, onClick }) {
  const scale = 0.68;
  return (
    <div
      onClick={onClick}
      style={{
        display:"flex", flexDirection:"column", alignItems:"center", gap:14,
        cursor: onClick ? "pointer" : "default"
      }}
    >
      <div style={{
        fontSize:10, fontWeight:700, letterSpacing:"0.12em", textTransform:"uppercase",
        color: active ? "var(--sage)" : "rgba(255,255,255,0.3)",
        padding:"4px 12px", borderRadius:6,
        background: active ? "rgba(122,173,112,0.12)" : "transparent",
        border: active ? "1px solid rgba(122,173,112,0.3)" : "1px solid transparent",
        transition:"all 0.2s"
      }}>{label}</div>

      <div style={{
        width: width*scale, height: height*scale,
        borderRadius: 44*scale,
        background:"#0c1410",
        border: active ? "2px solid rgba(122,173,112,0.5)" : "2px solid rgba(255,255,255,0.07)",
        boxShadow: active
          ? "0 0 0 4px rgba(122,173,112,0.08), 0 24px 64px rgba(0,0,0,0.7)"
          : "0 16px 48px rgba(0,0,0,0.5)",
        overflow:"hidden", position:"relative",
        transition:"border 0.2s, box-shadow 0.2s", flexShrink:0
      }}>
        {/* notch */}
        <div style={{
          position:"absolute", top:0, left:"50%", transform:"translateX(-50%)",
          width:110*scale, height:32*scale,
          background:"#0c1410",
          borderBottomLeftRadius:16*scale, borderBottomRightRadius:16*scale,
          zIndex:20
        }}/>
        {/* status bar */}
        <div style={{
          position:"absolute", top:0, left:0, right:0, height:44*scale,
          display:"flex", alignItems:"flex-end", justifyContent:"space-between",
          padding:`0 ${20*scale}px ${8*scale}px`, zIndex:19
        }}>
          <span style={{fontSize:10*scale, fontWeight:600, color:"rgba(255,255,255,0.75)"}}>9:41</span>
          <div style={{display:"flex", gap:4*scale, alignItems:"center"}}>
            <svg width={14*scale} height={10*scale} viewBox="0 0 14 10" fill="rgba(255,255,255,0.7)">
              <rect x="0" y="6" width="2" height="4" rx="0.5"/><rect x="3" y="4" width="2" height="6" rx="0.5"/>
              <rect x="6" y="2" width="2" height="8" rx="0.5"/><rect x="9" y="0" width="2" height="10" rx="0.5"/>
            </svg>
            <svg width={20*scale} height={10*scale} viewBox="0 0 20 10" fill="rgba(255,255,255,0.7)">
              <rect x="0.5" y="0.5" width="17" height="9" rx="2" stroke="rgba(255,255,255,0.5)" strokeWidth="1" fill="none"/>
              <rect x="1.5" y="1.5" width="13" height="7" rx="1.5"/>
              <rect x="18" y="3" width="1.5" height="4" rx="0.75"/>
            </svg>
          </div>
        </div>
        {/* screen */}
        <div style={{ position:"absolute", inset:0, paddingTop:44*scale, overflow:"hidden" }}>
          {children}
        </div>
        {/* home indicator */}
        <div style={{
          position:"absolute", bottom:8*scale, left:"50%", transform:"translateX(-50%)",
          width:110*scale, height:4*scale, borderRadius:2*scale,
          background:"rgba(255,255,255,0.28)", zIndex:20
        }}/>
      </div>

      {/* variant badge */}
      <div style={{
        fontSize:10, fontFamily:"'DM Mono',monospace", color:"rgba(255,255,255,0.2)",
        letterSpacing:"0.06em"
      }}>{variant}</div>
    </div>
  );
}

const S = 0.68;

/* ═══════════════════════════════════
   VARIANT A — CENTERED MINIMAL
   Tek sütun, ortalanmış, geniş beyaz boşluk
═══════════════════════════════════ */
function VariantA() {
  const [showPass, setShowPass] = useState(false);
  const [emailFocus, setEmailFocus] = useState(false);
  const [passFocus, setPassFocus] = useState(true);
  const [tab, setTab] = useState("login");

  const inputStyle = (focused) => ({
    width:"100%", height:52*S,
    borderRadius:14*S,
    background: focused ? "rgba(255,255,255,0.07)" : "rgba(255,255,255,0.04)",
    border: focused ? `1.5px solid rgba(122,173,112,0.7)` : "1.5px solid rgba(255,255,255,0.1)",
    boxShadow: focused ? "0 0 0 3px rgba(122,173,112,0.12)" : "none",
    display:"flex", alignItems:"center",
    padding:`0 ${14*S}px`, gap:10*S,
    transition:"all 0.2s"
  });

  return (
    <div style={{
      height:"100%",
      background:"linear-gradient(180deg, #0b1a0c 0%, #080f09 100%)",
      display:"flex", flexDirection:"column",
      padding:`${20*S}px ${20*S}px`
    }}>
      {/* logo mark */}
      <div style={{display:"flex", justifyContent:"center", marginBottom:28*S, marginTop:8*S}}>
        <div style={{
          width:52*S, height:52*S, borderRadius:16*S,
          background:"linear-gradient(135deg, rgba(74,124,66,0.3), rgba(201,116,122,0.15))",
          border:"1px solid rgba(122,173,112,0.25)",
          display:"flex", alignItems:"center", justifyContent:"center",
          boxShadow:"0 8px 24px rgba(0,0,0,0.4)"
        }}>
          <Ic d={PATH.wave} size={26*S} color="var(--sage)"/>
        </div>
      </div>

      {/* heading */}
      <div style={{textAlign:"center", marginBottom:24*S}}>
        <div style={{
          fontFamily:"'DM Serif Display',serif",
          fontSize:26*S, color:"rgba(255,255,255,0.95)", lineHeight:1.15, marginBottom:6*S
        }}>
          {tab==="login" ? "Tekrar hoş geldin" : "Hesap oluştur"}
        </div>
        <div style={{fontSize:13*S, color:"rgba(255,255,255,0.38)", lineHeight:1.5}}>
          {tab==="login" ? "Sesli rehbere devam et" : "Ücretsiz başla, dünyayı keşfet"}
        </div>
      </div>

      {/* tab toggle */}
      <div style={{
        display:"flex", borderRadius:12*S, overflow:"hidden",
        background:"rgba(255,255,255,0.05)",
        border:"1px solid rgba(255,255,255,0.08)",
        marginBottom:20*S
      }}>
        {["login","register"].map(t=>(
          <button key={t} onClick={()=>setTab(t)} style={{
            flex:1, height:38*S, border:"none", cursor:"pointer",
            background: tab===t ? "rgba(74,124,66,0.3)" : "transparent",
            borderRadius:tab===t ? 10*S : 0,
            fontSize:13*S, fontWeight:600, fontFamily:"'DM Sans',sans-serif",
            color: tab===t ? "var(--sage)" : "rgba(255,255,255,0.3)",
            transition:"all 0.2s",
            margin: tab===t ? "3*S" : 0
          }}>
            {t==="login" ? "Giriş Yap" : "Kayıt Ol"}
          </button>
        ))}
      </div>

      {/* email */}
      <div style={{marginBottom:12*S}}>
        <div style={{fontSize:10*S, fontWeight:700, color:"rgba(255,255,255,0.35)", letterSpacing:"0.1em", marginBottom:6*S}}>
          E-POSTA
        </div>
        <div style={inputStyle(emailFocus)}>
          <Ic d={PATH.mail} size={17*S} color={emailFocus?"var(--sage)":"rgba(255,255,255,0.25)"}/>
          <span style={{fontSize:14*S, color: emailFocus?"rgba(255,255,255,0.85)":"rgba(255,255,255,0.25)", flex:1}}>
            {emailFocus ? "ada@ornek.com" : "e-posta adresiniz"}
          </span>
        </div>
      </div>

      {/* password */}
      <div style={{marginBottom:8*S}}>
        <div style={{fontSize:10*S, fontWeight:700, color:"rgba(255,255,255,0.35)", letterSpacing:"0.1em", marginBottom:6*S}}>
          ŞİFRE
        </div>
        <div style={inputStyle(passFocus)}>
          <Ic d={PATH.lock} size={17*S} color={passFocus?"var(--sage)":"rgba(255,255,255,0.25)"}/>
          <span style={{fontSize:14*S, color:"rgba(255,255,255,0.85)", flex:1, letterSpacing:"0.25em"}}>
            ••••••••
          </span>
          <div onClick={()=>setShowPass(!showPass)} style={{cursor:"pointer", opacity:0.5, display:"flex"}}>
            <Ic d={showPass?PATH.eyeOff:PATH.eye} size={17*S} color="rgba(255,255,255,0.6)"/>
          </div>
        </div>
      </div>

      {/* forgot */}
      <div style={{textAlign:"right", marginBottom:20*S}}>
        <span style={{fontSize:12*S, color:"var(--sage)", fontWeight:500}}>Şifremi unuttum</span>
      </div>

      {/* primary CTA */}
      <div style={{
        width:"100%", height:52*S, borderRadius:14*S,
        background:"linear-gradient(135deg, var(--meadow), #3d6b36)",
        display:"flex", alignItems:"center", justifyContent:"center",
        gap:8*S, cursor:"pointer",
        boxShadow:"0 6px 20px rgba(74,124,66,0.4)",
        marginBottom:14*S
      }}>
        <span style={{fontSize:15*S, fontWeight:700, color:"#fff"}}>
          {tab==="login" ? "Giriş Yap" : "Hesap Oluştur"}
        </span>
        <Ic d={PATH.arrow} size={17*S} color="#fff"/>
      </div>

      {/* voice login */}
      <div style={{
        width:"100%", height:48*S, borderRadius:14*S,
        border:"1.5px solid rgba(201,116,122,0.35)",
        background:"rgba(201,116,122,0.06)",
        display:"flex", alignItems:"center", justifyContent:"center",
        gap:8*S, cursor:"pointer", marginBottom:20*S
      }}>
        <div style={{position:"relative"}}>
          <Ic d={PATH.mic} size={17*S} color="var(--rose)"/>
          <div style={{
            position:"absolute", inset:-4*S, borderRadius:"50%",
            border:"1.5px solid rgba(201,116,122,0.5)",
            animation:"pulseRing 2s infinite"
          }}/>
        </div>
        <span style={{fontSize:13*S, fontWeight:600, color:"var(--rose)"}}>Sesle Giriş</span>
      </div>

      {/* divider */}
      <div style={{display:"flex", alignItems:"center", gap:10*S, marginBottom:14*S}}>
        <div style={{flex:1, height:1, background:"rgba(255,255,255,0.07)"}}/>
        <span style={{fontSize:11*S, color:"rgba(255,255,255,0.2)"}}>veya</span>
        <div style={{flex:1, height:1, background:"rgba(255,255,255,0.07)"}}/>
      </div>

      {/* social */}
      <div style={{display:"flex", gap:10*S}}>
        {[{icon:PATH.apple, label:"Apple"},{icon:PATH.google, label:"Google"}].map(s=>(
          <div key={s.label} style={{
            flex:1, height:44*S, borderRadius:12*S,
            border:"1px solid rgba(255,255,255,0.1)",
            background:"rgba(255,255,255,0.04)",
            display:"flex", alignItems:"center", justifyContent:"center", gap:7*S, cursor:"pointer"
          }}>
            <Ic d={s.icon} size={16*S} color="rgba(255,255,255,0.6)"/>
            <span style={{fontSize:12*S, fontWeight:500, color:"rgba(255,255,255,0.5)"}}>{s.label}</span>
          </div>
        ))}
      </div>

      {/* terms */}
      <div style={{textAlign:"center", marginTop:"auto", paddingTop:14*S, fontSize:10*S, color:"rgba(255,255,255,0.18)", lineHeight:1.5}}>
        Devam ederek <span style={{color:"rgba(255,255,255,0.4)"}}>Gizlilik Politikası</span>'nı kabul edersiniz
      </div>
    </div>
  );
}

/* ═══════════════════════════════════
   VARIANT B — SPLIT HERO
   Üst yarı: görsel hero, alt yarı: form
═══════════════════════════════════ */
function VariantB() {
  const [activeField, setActiveField] = useState("email");

  return (
    <div style={{height:"100%", background:"#080f09", display:"flex", flexDirection:"column"}}>
      {/* HERO HALF */}
      <div style={{
        height:"38%", position:"relative", overflow:"hidden",
        background:"linear-gradient(160deg, #1a3a1a 0%, #0f2410 50%, #0b1a0c 100%)",
        display:"flex", flexDirection:"column", alignItems:"center", justifyContent:"flex-end",
        paddingBottom:20*S
      }}>
        {/* ambient orb */}
        <div style={{
          position:"absolute", top:-60*S, left:"50%", transform:"translateX(-50%)",
          width:220*S, height:220*S, borderRadius:"50%",
          background:"radial-gradient(circle, rgba(74,124,66,0.18) 0%, transparent 70%)"
        }}/>
        {/* rose accent orb */}
        <div style={{
          position:"absolute", bottom:-20*S, right:-20*S,
          width:100*S, height:100*S, borderRadius:"50%",
          background:"radial-gradient(circle, rgba(201,116,122,0.15) 0%, transparent 70%)"
        }}/>
        {/* logo + title */}
        <div style={{position:"relative", textAlign:"center"}}>
          <div style={{
            width:44*S, height:44*S, borderRadius:14*S,
            background:"rgba(255,255,255,0.08)",
            border:"1px solid rgba(122,173,112,0.2)",
            display:"flex", alignItems:"center", justifyContent:"center",
            margin:"0 auto", marginBottom:8*S,
            backdropFilter:"blur(12px)"
          }}>
            <Ic d={PATH.wave} size={22*S} color="var(--sage)"/>
          </div>
          <div style={{fontFamily:"'DM Serif Display',serif", fontSize:22*S, color:"#fff", lineHeight:1.1}}>VoiceGuide</div>
